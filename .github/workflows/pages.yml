name: Deploy project website

on:
  push:
    branches: [main, master]
    paths:
      - 'website/**'
      - 'tools/build_website.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build the lightweight static site
        env:
          UNBOUND_DOWNLOAD_URL: ${{ vars.UNBOUND_DOWNLOAD_URL }}
        run: python3 tools/build_website.py
      - name: Upload only the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
